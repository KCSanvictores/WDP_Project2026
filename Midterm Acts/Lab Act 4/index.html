<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CSS Box Model</title>
        <style>
            .box {
                width: 200px;
                height: 100px;
                padding: 20px;
                border: 2px solid black;
                margin: 10px;
            }

            .red-box {
                width: 300px;  /* Made it wider */
                height: 200px; /* Made it taller */
                border: 3px solid red; /* Red border */
            }
        </style>
    </head>
    <body>

        <header class="box">
            This is the header content.
        </header>

        <div class="box red-box">
            This is another box.
        </div>

    </body>
</html>
